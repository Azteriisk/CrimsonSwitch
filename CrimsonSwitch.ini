; =========================================================
; Crimson Desert Early Trio Mercenary Switch Configuration
; Unlocks Kliff, Damiane, and Oongka from the Prologue
; =========================================================

[General]
UnlockAllFromStart = true
EnableDirectHotkeys = true
SpawnMissingCompanions = true

[Hotkeys]
; RequireModifier prevents hotkeys from colliding with standard gameplay actions
; (e.g. 1/2/3 for potions/consumables/quick slots, Tab for target lock-on)
; ModifierKey: 0x12 = ALT, 0x11 = CTRL, 0x10 = SHIFT, 0x00 = None
RequireModifier = true
ModifierKey = 0x12

; Hotkeys when Modifier is held (Default: Alt+1, Alt+2, Alt+3, Alt+C):
; 0x31 = '1' (Alt + 1 -> Kliff)
; 0x32 = '2' (Alt + 2 -> Damiane)
; 0x33 = '3' (Alt + 3 -> Oongka)
; 0x43 = 'C' (Alt + C -> Cycle Next Mercenary)
KeyKliff = 0x31
KeyDamiane = 0x32
KeyOongka = 0x33
KeyCycleNext = 0x43

; Alternative: Dedicated Function Keys (No modifier needed)
; Set RequireModifier = false and use:
; KeyKliff = 0x75    ; F6
; KeyDamiane = 0x76  ; F7
; KeyOongka = 0x77   ; F8
; KeyCycleNext = 0x78; F9

; Alternative: Numpad Keys
; KeyKliff = 0x61    ; Numpad 1
; KeyDamiane = 0x62  ; Numpad 2
; KeyOongka = 0x63   ; Numpad 3
; KeyCycleNext = 0x60; Numpad 0

[Advanced]
DebugLogging = true
AllocateConsole = false
